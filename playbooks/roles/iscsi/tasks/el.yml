---
- name: "Perform a discovery on {{ iscsi_ip }} and show available target nodes"
  community.general.open_iscsi:
    show_nodes: yes
    discover: yes
    portal: '{{ iscsi_ip }}'
  register: nodes

- name: Connect to the named target, after updating the local persistent database (cache)
  community.general.open_iscsi:
    login: yes
    target: '{{ nodes["nodes"][0] }}'
  register: target
      
- name: create local storage directory
  file:
    path: "{{ local_path }}"
    state: directory
    owner: opc
    group: opc

- name: create a filesystem
  filesystem:
    dev: '{{ target["devicenodes"][0] }}'
    fstype: xfs
  when: not ('slurm_backup' in group_names)

- name: Read the iSCSI filesystem UUID
  command: 'blkid -s UUID -o value {{ target["devicenodes"][0] }}'
  register: iscsi_filesystem_uuid
  changed_when: false
  retries: 10
  delay: 2
  until: iscsi_filesystem_uuid.rc == 0 and iscsi_filesystem_uuid.stdout | length > 0

- name: Mount local volume
  mount:
    path: "{{ local_path }}"
    src: 'UUID={{ iscsi_filesystem_uuid.stdout }}'
    fstype: xfs
    opts: defaults,noatime,_netdev
    state: mounted
