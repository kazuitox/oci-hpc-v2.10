---
cluster: "myslurm"

attributes:
  desktop:
    label: "Desktop Environment"
    widget: select
    value: "gnome"
    options:
      - ["GNOME", "gnome"]
    help: "現在の dcv ノードイメージで利用できるデスクトップ環境です。"
    cacheable: false

  dcv_resolution:
    label: "Initial display resolution"
    widget: select
    value: "1920x1080"
    options:
      - ["1280 x 720", "1280x720"]
      - ["1600 x 900", "1600x900"]
      - ["1920 x 1080", "1920x1080"]
    help: "接続後は DCV の表示メニューから自動調整または別の解像度へ変更できます。"

{% if ood_desktop_use_gpu | default(false) | bool %}
  dcv_gl:
    label: "GPU-accelerated OpenGL"
    widget: select
    value: "on"
    options:
      - ["Enabled", "on"]
      - ["Disabled", "off"]
    help: "Enabled の場合は DCV-GL を使って A10 GPU を仮想セッションへ公開します。"
{% endif %}

  dcv_max_clients:
    label: "Maximum concurrent clients"
    widget: number_field
    value: 1
    min: 1
    max: 4
    step: 1
    required: true
    help: "同時に接続できる DCV クライアント数です。"

  dcv_storage:
    label: "File transfer"
    widget: select
    value: "home"
    options:
      - ["Enabled (home directory)", "home"]
      - ["Disabled", "off"]
    help: "Enabled の場合、DCV のファイル転送先をホームディレクトリに設定します。"

  bc_num_hours:
    label: "Number of hours"
    value: 1
    min: 1
    step: 1
    help: "ジョブと DCV セッションを維持する時間です。"

  dcv_eula_accept:
    widget: "check_box"
    label: "Amazon DCVが上記のとおりインストールされること、およびAmazon DCV EULAの適用を確認し、適用される条件を遵守することに同意します。"
    checked_value: 1
    unchecked_value: 0
    required: true
    cacheable: false
    help: |-
      **Amazon DCVについて**

      Launchを実行すると、作成されるデスクトップ計算ノードにAmazon DCV Serverが自動的にダウンロード・インストールされます。Amazon DCVはAmazon Web Servicesが提供するソフトウェアであり、Amazon DCV EULAが適用されます。

      本機能は、Amazon DCVを使用したリモートデスクトップ接続の検証を目的としています。本構成ではAmazon DCV Serverに別途ライセンスを設定しないため、インストール時に自動的に適用される自動評価ライセンスを使用します。自動評価ライセンスはインストール後30日間有効で、有効期限後はAmazon DCVセッションを新規作成またはホストできません。継続利用または本番利用には、利用者が適切なライセンスを用意し、Amazon DCVのライセンス条件およびEULAを確認・遵守する必要があります。

  bc_queue: "dcv"

form:
  - desktop
  - dcv_resolution
{% if ood_desktop_use_gpu | default(false) | bool %}
  - dcv_gl
{% endif %}
  - dcv_max_clients
  - dcv_storage
  - bc_num_hours
  - dcv_eula_accept
  - bc_queue
