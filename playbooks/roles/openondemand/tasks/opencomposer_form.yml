---
- name: OpenComposer | Validate Slurm queue definitions
  ansible.builtin.assert:
    that:
      - queues | default([]) | length > 0
      - queue | default('') | length > 0
      - (queue | default('')) in (queues | default([]) | map(attribute='name') | list)
    fail_msg: >-
      OpenComposer needs queues.conf to contain the stack's default Slurm queue.

- name: OpenComposer | Validate partition instance types
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name is string
      - item.name | trim | length > 0
      - (item.name | default('', true) | string) is match('^[A-Za-z0-9_-]+$')
      - item.instance_types | default([]) | length > 0
    fail_msg: >-
      Every queues.conf partition needs at least one instance type and a name
      containing only letters, numbers, underscores, and hyphens so that
      OpenComposer v2.0.2 can safely use it in a dynamic form.
  loop: "{{ queues }}"
  loop_control:
    label: "{{ item.name | default('unnamed partition') }}"

- name: OpenComposer | Validate constraint names
  ansible.builtin.assert:
    that:
      - item.1.name is defined
      - item.1.name is string
      - item.1.name | trim | length > 0
      - (item.1.name | default('', true) | string) is match('^[A-Za-z0-9_-]+$')
    fail_msg: >-
      Every queues.conf instance type name must be a non-empty Slurm constraint
      containing only letters, numbers, underscores, and hyphens so that
      OpenComposer v2.0.2 can safely use it in a dynamic form.
  loop: "{{ queues | subelements('instance_types') }}"
  loop_control:
    label: >-
      {{ item.0.name | default('unnamed partition', true) }} /
      {{ item.1.name | default('unnamed constraint', true) }}

- name: OpenComposer | Create application definition directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ ood_opencomposer_apps_dir }}"
    - "{{ ood_opencomposer_apps_dir }}/slurm"

- name: OpenComposer | Install the Slurm job form
  ansible.builtin.template:
    src: opencomposer_slurm_form.yml.j2
    dest: "{{ ood_opencomposer_apps_dir }}/slurm/form.yml"
    owner: root
    group: root
    mode: "0644"
  register: ood_opencomposer_form
