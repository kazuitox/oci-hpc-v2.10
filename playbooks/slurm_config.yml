- hosts: controller,slurm_backup,compute,login
  gather_facts: true
  vars:
    destroy: false
    initial: true
    download_path: "{{ nfs_target_path if create_fss | bool else ( cluster_nfs_path if cluster_nfs|bool else '/tmp')  }}"
    enroot_top_path: "{{ nvme_path }}/enroot/"
  vars_files:
    - "/opt/oci-hpc/conf/queues.conf"
  tasks:
    - include_role:
        name: slurm
      when: slurm|default(true)|bool

- hosts: controller
  become: true
  gather_facts: false
  vars_files:
    - "/opt/oci-hpc/conf/queues.conf"
  tasks:
    - name: OpenComposer | Refresh constraint choices from queues.conf
      ansible.builtin.include_role:
        name: openondemand
        tasks_from: opencomposer_refresh_form
      when:
        - slurm | default(true) | bool
        - use_ood | default(false) | bool
